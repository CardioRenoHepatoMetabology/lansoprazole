name: Automated XeLaTeX Compilation

on:
  push:
    paths:
      - '**.tex'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live and Paratype Fonts
        run: |
          sudo apt-get update -y
          # fonts-paratype устанавливает официальные шрифты PT Serif в систему
          sudo apt-get install -y texlive-xetex texlive-lang-cyrillic texlive-fonts-recommended fonts-noto fonts-paratype

      - name: Compile LaTeX to PDF
        run: |
          TEX_FILE=$(ls *.tex | head -n 1)
          xelatex -interaction=nonstopmode "$TEX_FILE"
          xelatex -interaction=nonstopmode "$TEX_FILE"

      - name: Commit and Push compiled PDF
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          
          if ls *.pdf 1> /dev/null 2>&1; then
            PDF_FILE=$(ls *.pdf | head -n 1)
            git add "$PDF_FILE"
            
            if git diff --staged --quiet; then
              echo "Изменений в PDF-документе не обнаружено."
            else
              git commit -m "Auto-compiled LaTeX PDF [skip ci]"
              git push origin HEAD:${{ github.ref }}
            fi
          else
            echo "КРИТИЧЕСКАЯ ОШИБКА: Компилятор XeLaTeX не создал PDF-файл. Проверьте логи предыдущего шага!"
            exit 1
          fi
